version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn-prediction-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - API_DEBUG=false
    restart: unless-stopped
    networks:
      - churn-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: churn-prediction-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - churn-network

networks:
  churn-network:
    driver: bridge
